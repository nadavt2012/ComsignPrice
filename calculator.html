<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון מחירים - Comsign</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Heebo', 'Assistant', system-ui, -apple-system, sans-serif;
            background: linear-gradient(to bottom right, #fef2f2, #fed7aa);
            min-height: 100vh;
            padding: 1rem;
            direction: rtl;
            text-align: right;
            font-feature-settings: 'liga' 1, 'kern' 1;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .elegant-text {
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.6;
        }

        .price-display {
            font-weight: 800;
            font-size: 1.25rem;
            font-feature-settings: 'tnum' 1;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 28rem;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e5e7eb;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .container:hover {
            border-color: #d1d5db;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 0.5rem;
        }

        .settings-btn {
            background: white;
            border: 2px solid #fca5a5;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .settings-btn:hover {
            background: #fef2f2;
            border-color: #f87171;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .settings-btn:active {
            transform: scale(0.95);
        }

        .content {
            padding: 1.5rem;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            color: #1f2937;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }

        .select, .input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            background: white;
            color: #111827;
            font-size: 1rem;
            transition: all 0.3s ease;
            min-height: 48px;
        }

        .select:focus, .input:focus {
            outline: none;
            border-color: #6b7280;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .select:hover, .input:hover {
            border-color: #9ca3af;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .option-with-icon {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .result-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: linear-gradient(to bottom right, #f9fafb, #f3f4f6);
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .result-section:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: #d1d5db;
        }

        .result-label {
            font-size: 1.125rem;
            color: #374151;
            text-align: center;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .result-box {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .result-box:hover {
            border-color: #d1d5db;
            transform: scale(1.02);
        }

        .final-price {
            font-size: 2.5rem;
            font-weight: 800;
            color: #dc2626;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .discount-info {
            font-size: 0.875rem;
            color: #6b7280;
            text-align: center;
            margin-top: 0.75rem;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
        }

        .footer p:first-child {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .footer p:last-child {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 90%;
            width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            direction: rtl;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
        }

        .close-btn:hover {
            color: #374151;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tab.active {
            border-bottom: 2px solid #dc2626;
            color: #dc2626;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .admin-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .admin-form.single-column {
            grid-template-columns: 1fr;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-primary {
            background: #dc2626;
            color: white;
        }

        .btn-primary:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-danger {
            background: white;
            color: #dc2626;
            border: 2px solid #dc2626;
        }

        .btn-danger:hover {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #b91c1c;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.2);
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .config-info {
            flex: 1;
        }

        .config-title {
            font-weight: 700;
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .config-details {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .config-details div {
            margin-bottom: 0.25rem;
        }

        .config-total {
            font-weight: 700;
            color: #059669;
            margin-top: 0.5rem;
        }

        .config-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon {
            width: 1rem;
            height: 1rem;
            color: #dc2626;
        }

        .icon.black {
            color: #000;
        }

        .summary-box {
            padding: 0.75rem;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            text-align: center;
            font-weight: 700;
            color: #059669;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .alert-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        .alert-content {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 400px;
            text-align: center;
            direction: rtl;
        }

        .alert-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .alert-description {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .alert-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        @media (max-width: 640px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }

            .admin-form {
                grid-template-columns: 1fr;
            }

            .config-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .config-actions {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="settings-btn" onclick="openAdminModal()" data-testid="button-settings">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
            
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGRlZnM+CjxsaW5lYXJHcmFkaWVudCBpZD0iZ3JhZCIgeDI9IjEwMCUiIHkyPSIxMDAlIj4KPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iI2RjMjYyNiIvPgo8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiNmMzUzMTciLz4KPC9saW5lYXJHcmFkaWVudD4KPC9kZWZzPgo8cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iODAiIHJ4PSIxMiIgZmlsbD0idXJsKCNncmFkKSIgc3Ryb2tlPSIjZGMyNjI2IiBzdHJva2Utd2lkdGg9IjIiLz4KPGNpcmNsZSBjeD0iNDAiIGN5PSIzMCIgcj0iOCIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjZGMyNjI2IiBzdHJva2Utd2lkdGg9IjIiLz4KPHJlY3QgeD0iMjgiIHk9IjQ1IiB3aWR0aD0iMjQiIGhlaWdodD0iOCIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjZGMyNjI2IiBzdHJva2Utd2lkdGg9IjEuNSIgcng9IjIiLz4KPHJlY3QgeD0iMzAiIHk9IjMzIiB3aWR0aD0iMjAiIGhlaWdodD0iMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz4KPGxpbmUgeDE9IjMzIiB5MT0iMzciIHgyPSI0MSIgeTI9IjM3IiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMS41Ii8+CjxsaW5lIHgxPSIzMyIgeTE9IjM5IiB4Mj0iNDciIHkyPSIzOSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjEuNSIvPgo8dGV4dCB4PSI0MCIgeT0iNjgiIGZvbnQtZmFtaWx5PSInSW50ZXInLCAnSGVlYm8nLCAnQXNzaXN0YW50Jywgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IiNmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkNvbXNpZ248L3RleHQ+Cjwvc3ZnPgo=" 
                 alt="Comsign Logo" 
                 class="logo" 
                 data-testid="logo-comsign">
        </div>

        <!-- Content -->
        <div class="content">
            <h1 class="title elegant-text" data-testid="title-main">
                מחירון Comsign
            </h1>
            <p class="subtitle" data-testid="subtitle-main">
                חשבו את עלות התעודות הדיגיטליות שלכם
            </p>

            <div class="form-group">
                <label class="label elegant-text" data-testid="label-project-type">סוג פרויקט</label>
                <select class="select" id="projectType" onchange="updateYears(); calculatePrice()" data-testid="select-project-type">
                    <option value="">בחר סוג פרויקט</option>
                    <option value="lawyers">עורכי דין</option>
                    <option value="architects">אדריכלים</option>
                    <option value="engineers">מהנדסים</option>
                    <option value="magna">מגנא</option>
                    <option value="regular">רגיל</option>
                </select>
            </div>

            <div class="form-group">
                <label class="label elegant-text">תקופה (שנים)</label>
                <select class="select" id="years" onchange="calculatePrice()">
                    <option value="">בחר תקופה</option>
                </select>
            </div>

            <div class="form-group">
                <label class="label elegant-text">כמות תעודות</label>
                <input type="number" class="input" id="certificates" value="1" min="1" onchange="calculatePrice()" data-testid="input-certificates">
            </div>

            <div class="form-group">
                <label class="label elegant-text">תעודות גיבוי</label>
                <input type="number" class="input" id="backupCertificates" value="0" min="0" onchange="calculatePrice()" data-testid="input-backup-certificates">
            </div>

            <!-- Results -->
            <div class="result-section" id="resultSection" style="display: none;">
                <p class="result-label elegant-text" data-testid="label-final-price">מחיר סופי</p>
                <div class="result-box">
                    <p class="final-price price-display" id="finalPrice" data-testid="text-total-price">
                        ₪0
                    </p>
                </div>
                <div class="discount-info" id="discountInfo" data-testid="text-discount-info"></div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p class="elegant-text" data-testid="text-company">Comsign 2025</p>
                <p class="elegant-text" data-testid="text-developer">Developed By NadavT</p>
            </div>
        </div>
    </div>

    <!-- Admin Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div id="adminLogin">
                <div class="modal-header">
                    <h3 class="modal-title elegant-text">התחברות אדמין</h3>
                    <button class="close-btn" onclick="closeAdminModal()">&times;</button>
                </div>
                <div class="admin-form single-column">
                    <input type="password" class="input" id="adminPassword" placeholder="הכנס סיסמה">
                    <button class="btn btn-primary" onclick="adminLogin()">התחבר</button>
                </div>
            </div>

            <div id="adminPanel" style="display: none;">
                <div class="modal-header">
                    <h3 class="modal-title elegant-text">פאנל ניהול</h3>
                    <button class="close-btn" onclick="closeAdminModal()">&times;</button>
                </div>

                <div class="tabs">
                    <button class="tab active" onclick="showTab('manage')">ניהול מחירים</button>
                    <button class="tab" onclick="showTab('settings')">הגדרות</button>
                </div>

                <div id="manageTab" class="tab-content active">
                    <h4 class="elegant-text" style="margin-bottom: 1rem;">הוספת תצורה חדשה</h4>
                    <div class="admin-form">
                        <div>
                            <label class="label elegant-text">סוג פרויקט</label>
                            <input type="text" class="input" id="newProjectType" placeholder="למשל: עורכי דין">
                        </div>
                        <div>
                            <label class="label elegant-text">שנים</label>
                            <input type="number" class="input" id="newYears" value="1">
                        </div>
                        <div>
                            <label class="label elegant-text">מחיר תעודה רגילה</label>
                            <input type="number" class="input" id="newBasePrice" value="0">
                        </div>
                        <div>
                            <label class="label elegant-text">בחר אייקון</label>
                            <select class="select" id="newIcon">
                                <option value="User">משתמש</option>
                                <option value="Scale">משפט</option>
                                <option value="Building">בניין</option>
                                <option value="Wrench">כלי עבודה</option>
                                <option value="GraduationCap">כובע סיום</option>
                                <option value="Briefcase">תיק עבודה</option>
                                <option value="Star">כוכב</option>
                                <option value="Heart">לב</option>
                                <option value="Home">בית</option>
                                <option value="Car">רכב</option>
                                <option value="Plane">מטוס</option>
                                <option value="Camera">מצלמה</option>
                                <option value="Music">מוזיקה</option>
                                <option value="Book">ספר</option>
                                <option value="Coffee">קפה</option>
                                <option value="Calendar">לוח שנה</option>
                                <option value="Award">פרס</option>
                                <option value="Shield">מגן</option>
                            </select>
                        </div>
                        <div>
                            <label class="label elegant-text">מחיר תעודת גיבוי</label>
                            <input type="number" class="input" id="newBackupPrice" value="0">
                        </div>
                        <div>
                            <label class="label elegant-text">סה"כ מחירים</label>
                            <div class="summary-box" id="newConfigTotal">₪0</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="createConfig()">הוסף תצורה</button>

                    <h4 class="elegant-text" style="margin: 2rem 0 1rem;">תצורות קיימות</h4>
                    <div id="configsList"></div>
                </div>

                <div id="settingsTab" class="tab-content">
                    <h4 class="elegant-text" style="margin-bottom: 1rem;">שינוי סיסמה</h4>
                    <div class="admin-form">
                        <div>
                            <label class="label elegant-text">סיסמה נוכחית</label>
                            <input type="password" class="input" id="currentPassword">
                        </div>
                        <div>
                            <label class="label elegant-text">סיסמה חדשה</label>
                            <input type="password" class="input" id="newPassword">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="changePassword()">שנה סיסמה</button>

                    <h4 class="elegant-text" style="margin: 2rem 0 1rem;">איפוס סיסמה</h4>
                    <p style="margin-bottom: 1rem; color: #6b7280;">איפוס הסיסמה לברירת המחדל</p>
                    <button class="btn btn-danger" onclick="resetPassword()">איפוס סיסמה</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="alert-modal" id="alertModal">
        <div class="alert-content">
            <h3 class="alert-title" id="alertTitle">האם אתה בטוח?</h3>
            <p class="alert-description" id="alertDescription">פעולה זו תמחק את התצורה לצמיתות.</p>
            <div class="alert-actions">
                <button class="btn btn-danger" id="alertConfirm">מחק</button>
                <button class="btn btn-secondary" onclick="closeAlert()">בטל</button>
            </div>
        </div>
    </div>

    <script>
        // Default configurations
        const defaultConfigs = [
            { id: '1', projectType: 'lawyers', years: 1, basePrice: 180, backupCertificatePrice: 50, icon: 'Scale' },
            { id: '2', projectType: 'lawyers', years: 2, basePrice: 320, backupCertificatePrice: 90, icon: 'Scale' },
            { id: '3', projectType: 'lawyers', years: 3, basePrice: 450, backupCertificatePrice: 120, icon: 'Scale' },
            { id: '4', projectType: 'architects', years: 1, basePrice: 180, backupCertificatePrice: 50, icon: 'Building' },
            { id: '5', projectType: 'architects', years: 2, basePrice: 320, backupCertificatePrice: 90, icon: 'Building' },
            { id: '6', projectType: 'architects', years: 4, basePrice: 600, backupCertificatePrice: 150, icon: 'Building' },
            { id: '7', projectType: 'architects', years: 5, basePrice: 750, backupCertificatePrice: 180, icon: 'Building' },
            { id: '8', projectType: 'engineers', years: 1, basePrice: 180, backupCertificatePrice: 50, icon: 'Wrench' },
            { id: '9', projectType: 'engineers', years: 2, basePrice: 320, backupCertificatePrice: 90, icon: 'Wrench' },
            { id: '10', projectType: 'engineers', years: 3, basePrice: 450, backupCertificatePrice: 120, icon: 'Wrench' },
            { id: '11', projectType: 'magna', years: 1, basePrice: 220, backupCertificatePrice: 60, icon: 'GraduationCap' },
            { id: '12', projectType: 'magna', years: 2, basePrice: 400, backupCertificatePrice: 110, icon: 'GraduationCap' },
            { id: '13', projectType: 'regular', years: 1, basePrice: 150, backupCertificatePrice: 40, icon: 'User' },
            { id: '14', projectType: 'regular', years: 2, basePrice: 280, backupCertificatePrice: 70, icon: 'User' }
        ];

        // Storage functions
        function getConfigs() {
            const stored = localStorage.getItem('pricingConfigs');
            return stored ? JSON.parse(stored) : defaultConfigs;
        }

        function saveConfigs(configs) {
            localStorage.setItem('pricingConfigs', JSON.stringify(configs));
        }

        function getAdminPassword() {
            return localStorage.getItem('adminPassword') || '795915';
        }

        function setAdminPassword(password) {
            localStorage.setItem('adminPassword', password);
        }

        // UI Functions
        function updateYears() {
            const projectType = document.getElementById('projectType').value;
            const yearsSelect = document.getElementById('years');
            yearsSelect.innerHTML = '<option value="">בחר תקופה</option>';

            if (projectType) {
                const configs = getConfigs();
                const years = configs
                    .filter(config => config.projectType === projectType)
                    .map(config => config.years)
                    .sort((a, b) => a - b);

                years.forEach(year => {
                    const option = document.createElement('option');
                    option.value = year;
                    option.textContent = year + ' שנים';
                    yearsSelect.appendChild(option);
                });
            }

            calculatePrice();
        }

        function calculatePrice() {
            const projectType = document.getElementById('projectType').value;
            const years = parseInt(document.getElementById('years').value);
            const certificates = parseInt(document.getElementById('certificates').value) || 0;
            const backupCertificates = parseInt(document.getElementById('backupCertificates').value) || 0;

            const resultSection = document.getElementById('resultSection');
            const finalPrice = document.getElementById('finalPrice');
            const discountInfo = document.getElementById('discountInfo');

            if (!projectType || !years || certificates <= 0) {
                resultSection.style.display = 'none';
                return;
            }

            const configs = getConfigs();
            const config = configs.find(c => c.projectType === projectType && c.years === years);

            if (!config) {
                resultSection.style.display = 'none';
                return;
            }

            const regularCost = certificates * config.basePrice;
            const backupCost = backupCertificates * config.backupCertificatePrice;
            const totalPrice = regularCost + backupCost;

            finalPrice.textContent = '₪' + totalPrice.toLocaleString();
            
            if (backupCertificates > 0) {
                discountInfo.textContent = `${backupCertificates} תעודות גיבוי (₪${config.backupCertificatePrice} לכל אחת)`;
                discountInfo.style.display = 'block';
            } else {
                discountInfo.style.display = 'none';
            }

            resultSection.style.display = 'block';
        }

        // Admin functions
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('adminLogin').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password === getAdminPassword()) {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadConfigs();
                showMessage('התחברות הצליחה - ברוך הבא לפאנל הניהול', 'success');
            } else {
                showMessage('סיסמה שגויה', 'error');
            }
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        function updateNewConfigTotal() {
            const basePrice = parseFloat(document.getElementById('newBasePrice').value) || 0;
            const backupPrice = parseFloat(document.getElementById('newBackupPrice').value) || 0;
            document.getElementById('newConfigTotal').textContent = '₪' + (basePrice + backupPrice).toLocaleString();
        }

        function createConfig() {
            const projectType = document.getElementById('newProjectType').value;
            const years = parseInt(document.getElementById('newYears').value);
            const basePrice = parseFloat(document.getElementById('newBasePrice').value);
            const backupPrice = parseFloat(document.getElementById('newBackupPrice').value);
            const icon = document.getElementById('newIcon').value;

            if (!projectType || !years || basePrice < 0 || backupPrice < 0) {
                showMessage('אנא מלא את כל השדות', 'error');
                return;
            }

            const configs = getConfigs();
            const newConfig = {
                id: Date.now().toString(),
                projectType,
                years,
                basePrice,
                backupCertificatePrice: backupPrice,
                icon
            };

            configs.push(newConfig);
            saveConfigs(configs);
            loadConfigs();
            
            // Reset form
            document.getElementById('newProjectType').value = '';
            document.getElementById('newYears').value = '1';
            document.getElementById('newBasePrice').value = '0';
            document.getElementById('newBackupPrice').value = '0';
            document.getElementById('newIcon').value = 'User';
            updateNewConfigTotal();
            
            showMessage('תצורה חדשה נוצרה', 'success');
            updateYears(); // Refresh the main form
        }

        function loadConfigs() {
            const configs = getConfigs();
            const configsList = document.getElementById('configsList');
            configsList.innerHTML = '';

            configs.forEach(config => {
                const configDiv = document.createElement('div');
                configDiv.className = 'config-item';
                configDiv.innerHTML = `
                    <div class="config-info">
                        <div class="config-title">
                            <span>${config.projectType}</span>
                            ${getIconSvg(config.icon)}
                        </div>
                        <div class="config-details">
                            <div><strong>תקופה:</strong> ${config.years} שנים</div>
                            <div><strong>מחיר תעודה רגילה:</strong> ₪${config.basePrice}</div>
                            <div><strong>מחיר תעודת גיבוי:</strong> ₪${config.backupCertificatePrice}</div>
                        </div>
                        <div class="config-total price-display">
                            סה"כ: ₪${(config.basePrice + config.backupCertificatePrice).toLocaleString()}
                        </div>
                    </div>
                    <div class="config-actions">
                        <button class="btn btn-secondary" onclick="editConfig('${config.id}')">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                        <button class="btn btn-danger" onclick="confirmDelete('${config.id}', '${config.projectType}', ${config.years})">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                `;
                configsList.appendChild(configDiv);
            });
        }

        function getIconSvg(iconName) {

                'Building': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>',
                'Wrench': '<svg class="icon black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>',

                'Briefcase': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m8 0H8m8 0v10a2 2 0 01-2 2H10a2 2 0 01-2-2V6m8 0V4a2 2 0 00-2-2H10a2 2 0 00-2 2v2"></path></svg>',

                'Heart': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>',
                'Home': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>',
                'Car': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 6H4l2-4h9l-2 4zM4 15h16v-6H4v6z"></path></svg>',

                'Book': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>',

                'Calendar': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>',
                'Award': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>',
                'Shield': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>'
            };
            return icons[iconName] || icons['User'];
        }

        function confirmDelete(id, projectType, years) {
            document.getElementById('alertTitle').textContent = 'האם אתה בטוח?';
            document.getElementById('alertDescription').textContent = `פעולה זו תמחק את התצורה עבור ${projectType} (${years} שנים) לצמיתות. לא ניתן לבטל פעולה זו.`;
            document.getElementById('alertConfirm').onclick = () => deleteConfig(id);
            document.getElementById('alertModal').style.display = 'flex';
        }

        function deleteConfig(id) {
            const configs = getConfigs();
            const filteredConfigs = configs.filter(config => config.id !== id);
            saveConfigs(filteredConfigs);
            loadConfigs();
            closeAlert();
            showMessage('תצורה נמחקה', 'success');
            updateYears(); // Refresh the main form
        }

        function closeAlert() {
            document.getElementById('alertModal').style.display = 'none';
        }

        function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            if (currentPassword !== getAdminPassword()) {
                showMessage('הסיסמה הנוכחית שגויה', 'error');
                return;
            }

            if (!newPassword || newPassword.length < 3) {
                showMessage('הסיסמה החדשה חייבת להכיל לפחות 3 תווים', 'error');
                return;
            }

            setAdminPassword(newPassword);
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            showMessage('סיסמה שונתה בהצלחה', 'success');
        }

        function resetPassword() {
            setAdminPassword('795915');
            showMessage('סיסמה אופסה לברירת מחדל', 'success');
        }

        function showMessage(message, type) {
            // Create toast message
            const toast = document.createElement('div');
            toast.className = type === 'success' ? 'success-message' : 'error-message';
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.zIndex = '9999';
            toast.style.padding = '1rem 2rem';
            toast.style.borderRadius = '0.5rem';
            toast.style.fontWeight = '500';
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 3000);
        }

        // Event listeners for new config form
        document.getElementById('newBasePrice').addEventListener('input', updateNewConfigTotal);
        document.getElementById('newBackupPrice').addEventListener('input', updateNewConfigTotal);

        // Initialize the app
        updateNewConfigTotal();
        calculatePrice();
    </script>
</body>
</html>
