<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יוצר אייקונים - בחר תמונה</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 1200px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 32px;
    }
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .image-card {
      border: 3px solid #e0e0e0;
      border-radius: 15px;
      padding: 15px;
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
    }
    .image-card:hover {
      border-color: #667eea;
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }
    .image-card.selected {
      border-color: #667eea;
      background: #f0f4ff;
    }
    .image-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }
    .image-card .label {
      text-align: center;
      margin-top: 10px;
      font-weight: 600;
      color: #555;
    }
    .selected-badge {
      position: absolute;
      top: 25px;
      right: 25px;
      background: #667eea;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .btn-generate {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 18px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
    }
    .btn-generate:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-weight: 600;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .preview-icons {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 15px;
    }
    .preview-icons.show {
      display: block;
    }
    .preview-grid {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .preview-item {
      text-align: center;
    }
    .preview-item img {
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      margin-bottom: 10px;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 בחר אייקון למחשבון</h1>
    
    <div class="images-grid">
      <div class="image-card" onclick="selectImage(0)">
        <img src="attached_assets/stock_images/modern_calculator_ap_c4be3ec5.jpg" alt="אייקון 1">
        <div class="label">אייקון 1 - מודרני</div>
      </div>
      <div class="image-card" onclick="selectImage(1)">
        <img src="attached_assets/stock_images/modern_calculator_ap_3c73fe0e.jpg" alt="אייקון 2">
        <div class="label">אייקון 2 - מינימליסטי</div>
      </div>
      <div class="image-card" onclick="selectImage(2)">
        <img src="attached_assets/stock_images/modern_calculator_ap_7abf5810.jpg" alt="אייקון 3">
        <div class="label">אייקון 3 - מקצועי</div>
      </div>
    </div>

    <button class="btn-generate" onclick="generateIcons()" disabled>
      📥 צור אייקונים מהתמונה שבחרת
    </button>

    <div id="status"></div>

    <div class="preview-icons" id="preview">
      <h3 style="text-align: center; margin-bottom: 20px;">תצוגה מקדימה:</h3>
      <div class="preview-grid">
        <div class="preview-item">
          <img id="preview-192" width="192" height="192">
          <div>192x192</div>
        </div>
        <div class="preview-item">
          <img id="preview-512" width="256" height="256">
          <div>512x512</div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="canvas-192" width="192" height="192"></canvas>
  <canvas id="canvas-512" width="512" height="512"></canvas>

  <script>
    const images = [
      'attached_assets/stock_images/modern_calculator_ap_c4be3ec5.jpg',
      'attached_assets/stock_images/modern_calculator_ap_3c73fe0e.jpg',
      'attached_assets/stock_images/modern_calculator_ap_7abf5810.jpg'
    ];
    
    let selectedIndex = -1;

    function selectImage(index) {
      selectedIndex = index;
      
      // Update UI
      document.querySelectorAll('.image-card').forEach((card, i) => {
        if (i === index) {
          card.classList.add('selected');
          if (!card.querySelector('.selected-badge')) {
            const badge = document.createElement('div');
            badge.className = 'selected-badge';
            badge.textContent = '✓ נבחר';
            card.appendChild(badge);
          }
        } else {
          card.classList.remove('selected');
          const badge = card.querySelector('.selected-badge');
          if (badge) badge.remove();
        }
      });

      // Enable button
      document.querySelector('.btn-generate').disabled = false;
    }

    async function generateIcons() {
      if (selectedIndex === -1) return;

      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status';
      statusDiv.textContent = '⏳ יוצר אייקונים...';

      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = images[selectedIndex];
        });

        // Generate 192x192
        const canvas192 = document.getElementById('canvas-192');
        const ctx192 = canvas192.getContext('2d');
        ctx192.drawImage(img, 0, 0, 192, 192);
        const blob192 = await new Promise(resolve => canvas192.toBlob(resolve, 'image/png'));
        
        // Generate 512x512
        const canvas512 = document.getElementById('canvas-512');
        const ctx512 = canvas512.getContext('2d');
        ctx512.drawImage(img, 0, 0, 512, 512);
        const blob512 = await new Promise(resolve => canvas512.toBlob(resolve, 'image/png'));

        // Show preview
        document.getElementById('preview-192').src = URL.createObjectURL(blob192);
        document.getElementById('preview-512').src = URL.createObjectURL(blob512);
        document.getElementById('preview').classList.add('show');

        // Download files
        downloadBlob(blob192, 'icon-192.png');
        downloadBlob(blob512, 'icon-512.png');

        statusDiv.className = 'status success';
        statusDiv.innerHTML = '✅ האייקונים נוצרו בהצלחה!<br>📥 הקבצים ירדו אוטומטית - העתק אותם ל-client/public/';

      } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ שגיאה: ' + error.message;
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
