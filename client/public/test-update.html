<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>✅ בדיקה - העדכון עבד!</title>
    <style>
        body { font-family: Arial; background: #f0f8ff; margin: 40px; text-align: center; }
        h1 { color: #ff4444; font-size: 2em; }
        .time { background: #fff; padding: 20px; border-radius: 10px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🔥 העדכון החדש פועל! 🔥</h1>
    <div class="time">
        <p><strong>זמן עדכון:</strong> <span id="time"></span></p>
        <p>אם אתה רואה את הדף הזה - השינויים עובדים!</p>
    </div>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString('he-IL');
    </script>
</body>
</html>
