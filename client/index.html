<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    
    <!-- Cache Control for Development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- PWA Meta Tags -->
    <title>מחירון פרויקטים - קומסיין</title>
    <meta name="description" content="מחשבון מחירים מתקדם לפרויקטים שונים של קומסיין" />
    <meta name="theme-color" content="#ef4444" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="מחירון קומסיין" />
    
    <!-- PWA Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Optimized fonts loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/icon-192.png" as="image">
    <link rel="preload" href="/manifest.json" as="fetch" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Error Suppression Script -->
    <script>
      // Complete ResizeObserver error suppression
      const OriginalResizeObserver = window.ResizeObserver;
      window.ResizeObserver = class extends OriginalResizeObserver {
        constructor(callback) {
          super((entries, observer) => {
            window.requestAnimationFrame(() => {
              try {
                callback(entries, observer);
              } catch (e) {
                // Silently ignore all ResizeObserver errors
              }
            });
          });
        }
      };

      // Comprehensive error suppression
      const suppressError = (e) => {
        if (e.message && (
          e.message.includes('ResizeObserver') ||
          e.message.includes('loop completed with undelivered notifications') ||
          e.message.includes('undelivered notifications')
        )) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return false;
        }
      };

      window.addEventListener('error', suppressError, true);
      window.addEventListener('unhandledrejection', (e) => {
        if (e.reason?.message && (
          e.reason.message.includes('ResizeObserver') ||
          e.reason.message.includes('undelivered notifications')
        )) {
          e.preventDefault();
          return false;
        }
      }, true);

      // Override console methods
      const originalError = console.error;
      const originalWarn = console.warn;

      console.error = function(...args) {
        const msg = args[0];
        if (msg && (
          (typeof msg === 'string' && (msg.includes('ResizeObserver') || msg.includes('undelivered notifications'))) ||
          (typeof msg === 'object' && msg.message && (msg.message.includes('ResizeObserver') || msg.message.includes('undelivered notifications')))
        )) {
          return;
        }
        originalError.apply(console, args);
      };

      console.warn = function(...args) {
        const msg = args[0];
        if (msg && typeof msg === 'string' && (
          msg.includes('Missing `Description`') ||
          msg.includes('aria-describedby') ||
          msg.includes('ResizeObserver')
        )) {
          return;
        }
        originalWarn.apply(console, args);
      };
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration - Only in Production -->
    <script>
      // Disable Service Worker completely in development
      const isDevelopment = window.location.hostname === 'localhost' || 
                           window.location.hostname.includes('replit.dev') || 
                           window.location.hostname.includes('replit.co');
      
      if ('serviceWorker' in navigator && !isDevelopment) {
        // Production only - register SW
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw-v3.0.1.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
              registration.update();
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      } else if ('serviceWorker' in navigator && isDevelopment) {
        // Development - unregister all existing service workers
        console.log('Development mode: Unregistering all Service Workers for fresh content');
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function(boolean) {
              console.log('SW unregistered:', boolean);
            });
          }
        });
      }
      
      // Development: Add cache-busting timestamp to all requests
      if (isDevelopment) {
        const timestamp = Date.now();
        console.log('Development mode: Cache busting active', timestamp);
      }
    </script>
    
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
